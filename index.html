<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d30">
  <meta name="description" content="潮生中草药卡牌体验反馈问卷">
  <title>潮生 · 体验反馈</title>
  <style>
    :root{font-family:ui-sans-serif,"PingFang SC","Microsoft YaHei",sans-serif;color:#173d30;background:#f2f4ec;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 12%,#e4edc9 0,transparent 30%),radial-gradient(circle at 92% 90%,#d5e8de 0,transparent 33%),#f2f4ec}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:940px;margin:0 auto;padding:28px 22px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 25px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em}.mark{width:36px;height:36px;border:2px solid #173d30;border-radius:12px;display:grid;place-items:center;background:#dcecae;font-size:22px}.top small{color:#61786b;font-weight:600}.panel{display:grid;grid-template-columns:280px 1fr;min-height:610px;border:2px solid #193b2e;border-radius:26px;overflow:hidden;background:#fffef8;box-shadow:10px 12px 0 #d3e0c9,0 28px 60px #284d3230}.side{background:#173d30;color:#f8f5db;padding:34px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden}.side:before{content:"";position:absolute;inset:0;opacity:.12;background:linear-gradient(45deg,transparent 48%,#d9e8b8 49%,#d9e8b8 51%,transparent 52%);background-size:34px 34px}.side>*{position:relative}.eyebrow{font-size:13px;letter-spacing:.18em;color:#e0edb9;font-weight:800}.side h1{font-size:36px;line-height:1.17;margin:27px 0 15px;letter-spacing:.04em}.side p{line-height:1.8;color:#d5e3cd;margin:0;font-size:15px}.plant{margin:auto auto 12px;width:175px;height:180px;position:relative;border-bottom:3px solid #d6e9a4;transform:rotate(-5deg)}.plant:before{content:"";position:absolute;bottom:0;left:82px;width:4px;height:155px;background:#c7df8c;transform:rotate(23deg);border-radius:4px}.leaf{position:absolute;width:75px;height:37px;border:3px solid #c7df8c;border-radius:90% 5% 90% 5%;background:#6f9e57;transform:rotate(-28deg)}.leaf.a{left:18px;top:95px}.leaf.b{left:92px;top:60px;transform:rotate(128deg)}.leaf.c{left:25px;top:35px;transform:rotate(-30deg)}.seed{position:absolute;left:107px;top:8px;width:34px;height:34px;border-radius:50%;background:#edcb62;border:3px solid #f7e5a4}.side .foot{font-size:13px;color:#c5d7b5}.main{padding:42px 54px 36px;display:flex;flex-direction:column}.progress-row{display:flex;justify-content:space-between;color:#658076;font-size:14px;font-weight:800}.track{height:8px;border-radius:8px;background:#e6ece2;overflow:hidden;margin:15px 0 42px}.fill{height:100%;width:0;background:#83a84e;border-radius:8px;transition:width .3s}.question{flex:1;animation:rise .3s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.qtype{display:inline-block;background:#e7efd3;color:#45652e;border-radius:30px;padding:7px 13px;font-size:13px;font-weight:800}.question h2{font-size:27px;line-height:1.42;margin:20px 0 10px;letter-spacing:.01em}.hint{color:#6b7f73;line-height:1.6;margin:0 0 25px;font-size:15px}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{border:1.5px solid #d7e0d3;border-radius:13px;min-height:56px;padding:13px 15px;text-align:left;color:#234636;background:#fff;transition:.15s;display:flex;align-items:center;gap:12px}.option:hover,.score:hover{border-color:#83a84e;background:#f7faef}.option.selected,.score.selected{border-color:#356d43;background:#e9f2d7;box-shadow:inset 0 0 0 1px #356d43}.indicator{width:20px;height:20px;border:1.5px solid #99afa0;border-radius:50%;flex:none;display:grid;place-items:center}.option.multi .indicator{border-radius:5px}.selected .indicator{border-color:#356d43;background:#356d43;color:white}.selected .indicator:after{content:"✓";font-size:13px}.score-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}.score{min-height:48px;border:1.5px solid #d7e0d3;border-radius:9px;background:white;font-weight:800;color:#284a36}.scale-labels{display:flex;justify-content:space-between;margin-top:11px;color:#69806e;font-size:14px}.five{grid-template-columns:repeat(5,1fr);max-width:440px;gap:10px}.five .score{height:64px;font-size:24px}.na{margin-top:18px;background:none;border:0;color:#456a53;text-decoration:underline;padding:4px}.other,.comment{width:100%;border:1.5px solid #cbdacb;border-radius:12px;padding:14px 16px;margin-top:14px;color:#173d30;background:#fff;outline:none}.comment{min-height:145px;resize:vertical;margin-top:0;line-height:1.6}.other:focus,.comment:focus{border-color:#397449}.error{min-height:22px;color:#b53b35;font-size:14px;margin-top:12px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:19px;border-top:1px solid #e5ebe1}.back,.next{border-radius:12px;min-height:47px;padding:0 22px;font-weight:800}.back{background:transparent;color:#476453;border:1px solid #cbd9ca}.back:disabled{opacity:.4;cursor:default}.next{border:1px solid #173d30;background:#173d30;color:white;min-width:118px}.next:hover{background:#2c6046}.thanks{text-align:center;margin:auto}.thanks .icon{font-size:54px}.thanks h2{font-size:29px}.thanks p{color:#657c6d;line-height:1.8}.thanks button{border:1px solid #173d30;background:#173d30;color:#fff;padding:12px 22px;border-radius:11px}.fine{font-size:13px;color:#748779;text-align:center;margin-top:24px}@media(max-width:720px){.shell{padding:12px 12px 32px}.top{padding:8px 5px 18px}.panel{display:block;min-height:0;box-shadow:5px 6px 0 #d3e0c9;border-radius:20px}.side{padding:25px 24px 22px}.side h1{font-size:27px;margin:9px 0 6px}.side p{font-size:14px}.plant,.side .foot{display:none}.main{padding:26px 22px 24px;min-height:510px}.track{margin:12px 0 28px}.question h2{font-size:23px}.options{grid-template-columns:1fr}.score-grid{gap:3px}.score{font-size:13px;min-height:43px;padding:0}.five{gap:6px}.five .score{height:55px}.top small{font-size:12px}}
  </style>
</head>
<body>
  <div class="shell"><header class="top"><div class="brand"><div class="mark">✳</div><span>潮生 · 中草药卡牌</span></div><small>体验反馈 / FEEDBACK</small></header>
  <div class="panel"><aside class="side"><div class="eyebrow">CHAO SHENG / 体验回访</div><h1>你的体验，<br>让下一局更好。</h1><p>感谢你体验中草药卡牌。用约 1 分钟告诉我们真实感受，帮助我们继续改进卡牌与服务。</p><div class="plant" aria-hidden="true"><i class="leaf a"></i><i class="leaf b"></i><i class="leaf c"></i><i class="seed"></i></div><div class="foot">无需填写姓名或联系方式</div></aside>
  <main class="main"><div id="formArea"><div class="progress-row"><span id="stepLabel"></span><span id="pct"></span></div><div class="track"><div class="fill" id="fill"></div></div><section class="question" id="question" aria-live="polite"></section><div class="error" id="error" role="alert"></div><nav class="nav"><button class="back" id="back" type="button">上一题</button><button class="next" id="next" type="button">下一题</button></nav></div><div class="thanks" id="thanks" hidden><div class="icon">✳</div><h2>谢谢你的认真反馈！</h2><p>你的回答已在此浏览器完成记录。<br>这是一份演示版问卷，尚未连接商家收集系统。</p><button id="again" type="button">再填一份</button></div></main></div><div class="fine">潮生 · 中草药卡牌体验反馈问卷</div></div>
  <script>
  const questions=[
    {type:'nps',title:'根据最近一次体验，你有多大可能向朋友推荐「中草药卡牌」？',hint:'请用 0 到 10 分评价，0 分表示绝对不会，10 分表示一定会。'},
    {type:'multi',title:'你给出这个分数，主要是因为哪些方面？',hint:'可选择多个，也可以补充说明。',choices:['卡牌插画与视觉设计','对战玩法','规则易懂程度','中草药知识内容','卡牌与包装质量','价格与购买体验','其他']},
    {type:'single',title:'你最初是从哪里了解到这套卡牌的？',hint:'请选择最先接触到它的渠道。',choices:['横琴中医药文化博物馆','小红书','抖音','B站','淘宝','朋友推荐','其他']},
    {type:'single',title:'你是在哪里购买或体验这套卡牌的？',hint:'请选择最符合你情况的一项。',choices:['博物馆现场','淘宝店铺','文创店或桌游店','朋友分享试玩','其他']},
    {type:'rating',title:'你对卡牌的视觉设计满意吗？',hint:'1 分非常不满意，5 分非常满意。'},
    {type:'rating',title:'你觉得游戏规则容易理解吗？',hint:'1 分很难理解，5 分非常容易理解。',na:'还没有游玩'},
    {type:'rating',title:'你对购买过程或现场体验服务满意吗？',hint:'1 分非常不满意，5 分非常满意。',na:'未接触相关服务'},
    {type:'text',title:'如果只能改进一个地方，你最希望我们改进什么？',hint:'选填。无论是卡面、玩法、说明书还是服务，都欢迎告诉我们。'}
  ];
  let step=0;let answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){const q=questions[step],a=answers[step];$('stepLabel').textContent=`第 ${step+1} 题 / 共 ${questions.length} 题`;$('pct').textContent=`${Math.round(step/questions.length*100)}%`;$('fill').style.width=`${step/questions.length*100}%`;$('error').textContent='';$('back').disabled=step===0;$('next').textContent=step===questions.length-1?'提交反馈':'下一题';
    let body='';if(q.type==='nps'||q.type==='rating'){const count=q.type==='nps'?11:5;body=`<div class="score-grid ${count===5?'five':''}" role="group" aria-label="评分">${Array.from({length:count},(_,i)=>{const v=count===11?i:i+1;return `<button type="button" class="score ${a===v?'selected':''}" data-score="${v}" aria-pressed="${a===v}">${v}</button>`}).join('')}</div><div class="scale-labels"><span>${count===11?'绝对不会推荐':'低分'}</span><span>${count===11?'一定会推荐':'高分'}</span></div>${q.na?`<button type="button" class="na" data-na="1">${a===q.na?'✓ ':''}${q.na}</button>`:''}`}
    if(q.type==='single'||q.type==='multi'){let selected=q.type==='multi'?(a?.selected||[]):[a?.choice].filter(Boolean);body=`<div class="options" role="group" aria-label="选项">${q.choices.map((c,i)=>`<button type="button" class="option ${q.type==='multi'?'multi':''} ${selected.includes(c)?'selected':''}" data-choice="${i}" aria-pressed="${selected.includes(c)}"><span class="indicator"></span><span>${escape(c)}</span></button>`).join('')}</div>${selected.includes('其他')?`<input id="other" class="other" maxlength="120" placeholder="请补充说明（选填）" value="${escape(a?.other||'')}">`:''}`}
    if(q.type==='text')body=`<textarea class="comment" id="comment" maxlength="500" placeholder="写下你的想法……">${escape(a||'')}</textarea>`;
    $('question').innerHTML=`<span class="qtype">${{nps:'推荐意愿',multi:'多选',single:'单选',rating:'体验评分',text:'开放反馈'}[q.type]}${q.type==='text'?' · 选填':''}</span><h2>${q.title}</h2><p class="hint">${q.hint}</p>${body}`;
  }
  $('question').addEventListener('click',e=>{const score=e.target.closest('[data-score]'),choice=e.target.closest('[data-choice]'),na=e.target.closest('[data-na]'),q=questions[step];if(score){answers[step]=Number(score.dataset.score);render()}else if(na){answers[step]=q.na;render()}else if(choice){const c=q.choices[Number(choice.dataset.choice)];if(q.type==='single'){answers[step]={choice:c,other:answers[step]?.other||''}}else{const a=answers[step]||{selected:[],other:''};answers[step]={...a,selected:a.selected.includes(c)?a.selected.filter(x=>x!==c):[...a.selected,c]}}render()}});
  $('question').addEventListener('input',e=>{if(e.target.id==='other'){answers[step].other=e.target.value}if(e.target.id==='comment'){answers[step]=e.target.value}});
  $('back').addEventListener('click',()=>{if(step>0){step--;render()}});
  $('next').addEventListener('click',()=>{const q=questions[step],a=answers[step];if(q.type!=='text'&&(a===null||(q.type==='multi'&&!a.selected.length))){$('error').textContent='请先完成这道题，再继续。';return}if(step<questions.length-1){step++;render();return}try{localStorage.setItem('chaosheng-feedback-last',JSON.stringify({submittedAt:new Date().toISOString(),answers:answers.map((answer,i)=>({question:questions[i].title,answer}))}))}catch(e){}$('formArea').hidden=true;$('thanks').hidden=false});
  $('again').addEventListener('click',()=>{answers=Array(questions.length).fill(null);step=0;$('thanks').hidden=true;$('formArea').hidden=false;render()});render();
  </script>
</body></html>
